schema_version: 1

context:
  name: numkit
  version: "1.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/numkit-${{ version }}.tar.gz
  sha256: 3c979d43b1deb8e1381916a73686cee31a974b9605e27b9092e24ee3ae8ac72a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77
    - versioningit
  run:
    - python >=${{ python_min }}
    - numpy >=1.9
    - scipy >=1.0

tests:
  - python:
      imports:
        - numkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Numerical first aid kit (with numpy/scipy).
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/Becksteinlab/numkit
  repository: https://github.com/Becksteinlab/numkit
  documentation: https://numkit.readthedocs.io/

extra:
  recipe-maintainers:
    - orbeckst
    - njzjz
